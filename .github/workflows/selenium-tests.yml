name: Selenium tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  unit:
    name: Framework unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 25
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run quality checks and unit tests
        run: mvn --batch-mode --no-transfer-progress clean verify -Punit

      - name: Validate unit test reports
        if: always()
        run: test -n "$(find target/surefire-reports -type f -name 'TEST-*.xml' -size +0c 2>/dev/null | head -n 1)" || { echo "::error::No non-empty Surefire unit report found"; exit 1; }

      - name: Publish unit test summary
        if: always()
        run: python3 .github/scripts/summarize-surefire.py "Framework Quality & Unit Tests"

      - name: Upload unit test reports
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/surefire-reports/
          retention-days: 30

  smoke:
    name: Smoke tests (${{ matrix.environment }} / ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        browser: [chrome, firefox, edge]
        environment: ${{ fromJSON(vars.STAGING_BASE_URL != '' && '["qa","staging"]' || '["qa"]') }}

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 25
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install controlled Chrome
        # browser-actions/setup-chrome v2.1.1
        uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded
        if: matrix.browser == 'chrome'
        with:
          chrome-version: ${{ vars.CHROME_VERSION || 'stable' }}
          install-chromedriver: false

      - name: Validate Chrome installation
        if: matrix.browser == 'chrome'
        run: google-chrome --version

      - name: Run smoke tests
        env:
          BASE_URL: ${{ matrix.environment == 'staging' && vars.STAGING_BASE_URL || '' }}
        run: mvn --batch-mode --no-transfer-progress clean test -Psmoke -Denv=${{ matrix.environment }} -DbaseUrl="$BASE_URL" -Dbrowser=${{ matrix.browser }} -Dheadless=true -DpreflightCheck=true -DretryCount=0 -DrunId=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate smoke test reports
        if: always()
        run: test -n "$(find target/surefire-reports -type f -name 'TEST-*.xml' -size +0c 2>/dev/null | head -n 1)" || { echo "::error::No non-empty Surefire smoke report found"; exit 1; }

      - name: Publish smoke test summary
        if: always()
        run: python3 .github/scripts/summarize-surefire.py "Smoke Tests (${{ matrix.environment }} / ${{ matrix.browser }})"

      - name: Record browser and driver versions
        if: always()
        run: |
          google-chrome --version || true
          firefox --version || true
          microsoft-edge --version || true
          chromedriver --version || true
          geckodriver --version || true
          msedgedriver --version || true

      - name: Upload test reports
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smoke-reports-${{ matrix.environment }}-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/extent-reports/
            target/screenshots/
            target/diagnostics/
            target/logs/
            target/surefire-reports/
          retention-days: 30

  regression:
    name: Regression tests (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.STAGING_BASE_URL != '' && '["qa","staging"]' || '["qa"]') }}

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 25
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run regression tests
        env:
          BASE_URL: ${{ matrix.environment == 'staging' && vars.STAGING_BASE_URL || '' }}
        run: mvn --batch-mode --no-transfer-progress clean test -Pregression -Denv=${{ matrix.environment }} -DbaseUrl="$BASE_URL" -Dbrowser=firefox -Dheadless=true -DpreflightCheck=true -DretryCount=0 -DrunId=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate regression test reports
        if: always()
        run: test -n "$(find target/surefire-reports -type f -name 'TEST-*.xml' -size +0c 2>/dev/null | head -n 1)" || { echo "::error::No non-empty Surefire regression report found"; exit 1; }

      - name: Publish regression test summary
        if: always()
        run: python3 .github/scripts/summarize-surefire.py "Regression Tests (${{ matrix.environment }} / firefox)"

      - name: Record browser and driver versions
        if: always()
        run: |
          firefox --version || true
          geckodriver --version || true

      - name: Upload test reports
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regression-reports-${{ matrix.environment }}-firefox-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/extent-reports/
            target/screenshots/
            target/diagnostics/
            target/logs/
            target/surefire-reports/
          retention-days: 30
