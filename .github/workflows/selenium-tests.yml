name: Selenium tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (${{ matrix.environment }} / ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        browser: [chrome, firefox]
        environment: ${{ fromJSON(vars.STAGING_BASE_URL != '' && '["qa","staging"]' || '["qa"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run smoke tests
        env:
          BASE_URL: ${{ matrix.environment == 'staging' && vars.STAGING_BASE_URL || '' }}
        run: mvn --batch-mode --no-transfer-progress clean test -Psmoke -Denv=${{ matrix.environment }} -DbaseUrl="$BASE_URL" -Dbrowser=${{ matrix.browser }} -Dheadless=true -DretryCount=0 -DrunId=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports-${{ matrix.environment }}-${{ matrix.browser }}
          path: |
            target/extent-reports/
            target/screenshots/
            target/logs/
            target/surefire-reports/
          retention-days: 30

  regression:
    name: Regression tests (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.STAGING_BASE_URL != '' && '["qa","staging"]' || '["qa"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run regression tests
        env:
          BASE_URL: ${{ matrix.environment == 'staging' && vars.STAGING_BASE_URL || '' }}
        run: mvn --batch-mode --no-transfer-progress clean test -Pregression -Denv=${{ matrix.environment }} -DbaseUrl="$BASE_URL" -Dbrowser=chrome -Dheadless=true -DretryCount=0 -DrunId=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-reports-${{ matrix.environment }}
          path: |
            target/extent-reports/
            target/screenshots/
            target/logs/
            target/surefire-reports/
          retention-days: 30
